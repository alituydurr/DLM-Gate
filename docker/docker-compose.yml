services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: dlm-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  gate-1:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dlm-gate-1
    command: ["python", "-m", "src.stream.gate_worker"]
    restart: on-failure
    environment:
      REPLICA_ID: gate-1
      PEERS: gate-1,gate-2,gate-3
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOCAL_FALLBACK: "false"
    depends_on:
      - kafka

  gate-2:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dlm-gate-2
    command: ["python", "-m", "src.stream.gate_worker"]
    restart: on-failure
    environment:
      REPLICA_ID: gate-2
      PEERS: gate-1,gate-2,gate-3
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOCAL_FALLBACK: "false"
    depends_on:
      - kafka

  gate-3:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dlm-gate-3
    command: ["python", "-m", "src.stream.gate_worker"]
    restart: on-failure
    environment:
      REPLICA_ID: gate-3
      PEERS: gate-1,gate-2,gate-3
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOCAL_FALLBACK: "false"
    depends_on:
      - kafka

  dashboard:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dlm-dashboard
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOCAL_FALLBACK: "true"
      ENABLE_SPARK: "false"
    depends_on:
      - kafka
      - gate-1
      - gate-2
      - gate-3
